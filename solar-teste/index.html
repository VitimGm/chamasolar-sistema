<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1322">
  <title>Chama Solar · Central de vendas (teste)</title>
  <link rel="icon" href="marca/logo-cor.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=Exo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/marca.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="ceu" aria-hidden="true"></div>
  <aside class="lateral">
    <a class="logo" href="#painel"><img src="marca/logo-branco.webp" alt="Chama Solar" width="120" height="51"></a>
    <nav class="nav" aria-label="Principal">
      <a href="#painel" data-rota="painel"><span>◎</span>Painel</a>
      <a href="#novo" data-rota="novo"><span>＋</span>Novo orçamento</a>
      <a href="#agentes" data-rota="agentes"><span>✦</span>Agentes</a>
      <a href="#parametros" data-rota="parametros"><span>⚙</span>Parâmetros</a>
    </nav>
    <div class="selo-teste">TESTE · dados simulados<br><button type="button" id="resetar" class="link">recomeçar dados</button></div>
  </aside>
  <main id="app" class="conteudo"></main>
  <footer class="barra" id="barra" hidden>
    <div class="barra-in">
      <button class="btn vidro" id="btnVoltar" type="button">Voltar</button>
      <div class="barra-resumo" id="barraResumo"></div>
      <button class="btn sol" id="btnAvancar" type="button">Continuar</button>
    </div>
  </footer>
  <script src="js/dados-teste.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/conversao.js"></script>
  <script src="js/agentes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
