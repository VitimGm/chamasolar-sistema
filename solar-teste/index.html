<!doctype html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="#novo" aria-label="Chama Solar">

      <span class="selo-teste" title="Banco simulado no navegador. Nada vai para o Supabase.">TESTE · dados simulados</span>

  <main id="app" class="app"></main>

  <footer class="barra" id="barra" hidden>

      <button class="btn fantasma" id="btnVoltar" type="button">Voltar</button>
      <div class="barra-resumo" id="barraResumo"></div>
      <button class="btn primario" id="btnAvancar" type="button">Continuar</button>

  <script src="dados-teste.js"></script>
  <script src="motor.js"></script>
