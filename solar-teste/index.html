<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1322">
  <title>Chama Solar · Central de vendas (teste)</title>
  <link rel="icon" href="marca/logo-cor.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=Exo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/marca.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/icones.css">
</head>
<body>
  <div class="ceu" aria-hidden="true"></div>
  <aside class="lateral">
    <a class="logo" href="#painel"><img src="marca/logo-branco.webp" alt="Chama Solar" width="120" height="51"></a>
    <nav class="nav" aria-label="Principal">
      <a href="#dia" data-rota="dia"><span><i data-ico="relogio"></i></span>Meu dia</a>
      <a href="#painel" data-rota="painel"><span><i data-ico="painelControle"></i></span>Painel</a>
      <a href="#novo" data-rota="novo"><span><i data-ico="mais"></i></span>Novo orçamento</a>
      <a href="#clientes" data-rota="clientes"><span><i data-ico="pessoas"></i></span>Clientes</a>
      <a href="#radar" data-rota="radar"><span><i data-ico="grafico"></i></span>Radar</a>
      <a href="#parceiros" data-rota="parceiros"><span><i data-ico="medalha"></i></span>Parceiros</a>
      <a href="#arquivo" data-rota="arquivo"><span><i data-ico="documento"></i></span>Arquivo</a>
      <a href="#vendas" data-rota="vendas"><span><i data-ico="conta"></i></span>Vendas</a>
      <a href="#servicos" data-rota="servicos"><span><i data-ico="ferramenta"></i></span>Serviços</a>
      <a href="#usinas" data-rota="usinas"><span><i data-ico="sol"></i></span>Usinas</a>
      <a href="#catalogo" data-rota="catalogo"><span><i data-ico="catalogo"></i></span>Catálogo</a>
      <a href="#agentes" data-rota="agentes"><span><i data-ico="agentes"></i></span>Agentes</a>
      <a href="#parametros" data-rota="parametros"><span><i data-ico="ajustes"></i></span>Parâmetros</a>
    </nav>
    <div class="selo-teste">TESTE · dados simulados<br><button type="button" id="resetar" class="link">recomeçar dados</button></div>
  </aside>
  <main id="app" class="conteudo"></main>
  <footer class="barra" id="barra" hidden>
    <div class="barra-in">
      <button class="btn vidro" id="btnVoltar" type="button">Voltar</button>
      <div class="barra-resumo" id="barraResumo"></div>
      <button class="btn sol" id="btnAvancar" type="button">Continuar</button>
    </div>
  </footer>
  <script src="js/icones.js"></script>
  <script src="js/dados-teste.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/grupoa.js"></script>
  <script src="js/conversao.js"></script>
  <script src="js/agentes.js"></script>
  <script src="js/documentos.js"></script>
  <script src="js/cadencia.js"></script>
  <script src="js/abordagens.js"></script>
  <script src="js/usina3d.js"></script>
  <script src="js/cabos.js"></script>
  <script src="js/mppt.js"></script>
  <script src="js/fichas.js"></script>
  <script src="js/avulso.js"></script>
  <script src="js/jarvis.js"></script>
  <script src="js/resumo.js"></script>
  <script src="js/telhado.js"></script>
  <script src="js/usinas.js"></script>
  <script src="js/leitor-conta.js"></script>
  <script src="js/apresentacao.js"></script>
  <script src="js/cotador.js"></script>
  <script src="js/app.js"></script>
